name: Release Standalone HTML

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example v1.2.3)'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build standalone HTML
        run: npm run build:standalone

      - name: Verify standalone artifact excludes landing
        run: |
          test -f dist/index.html
          if grep -q 'data-landing' dist/index.html; then
            echo "Standalone artifact must not include landing markup."
            exit 1
          fi
          if grep -q 'data-enter-creator' dist/index.html; then
            echo "Standalone artifact must not include landing CTA selectors."
            exit 1
          fi
          if grep -q '#home' dist/index.html; then
            echo "Standalone artifact must not include #home route."
            exit 1
          fi
          grep -q 'data-step-next' dist/index.html
          grep -q 'data-faq-category' dist/index.html

      - name: Prepare release assets
        run: |
          cp dist/index.html seed-vault-standalone.html
          shasum -a 256 seed-vault-standalone.html > seed-vault-standalone.sha256

      - name: Publish release with standalone HTML asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            seed-vault-standalone.html
            seed-vault-standalone.sha256
